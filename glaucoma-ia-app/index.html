<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlaucoIA - Diagnóstico Asistido por IA</title>

    <!-- Font Awesome 6 (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
    <!-- Librerías para PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="app" class="glaucoia-app">
        <!-- ==================== MAIN CONTENT ==================== -->
        <main class="main-content" id="mainContent">
            <!-- El contenido se renderizará dinámicamente desde script.js -->
        </main>

        <!-- ==================== MODAL DE AUTENTICACIÓN ==================== -->
        <div class="auth-modal" id="authModal">
            <div class="auth-modal-content">
                <div class="auth-modal-header">
                    <h3 id="authModalTitle">Acceso</h3>
                    <button class="auth-modal-close" onclick="closeAuthModal()"><i class="fas fa-times"></i></button>
                </div>
                <div class="auth-modal-body">
                    <div id="authLoginForm">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Usuario / DNI</label>
                            <input type="text" class="form-control" id="authUser" placeholder="Ingresa tu DNI" value="42156783" />
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> Contraseña / Código</label>
                            <input type="password" class="form-control" id="authPassword" placeholder="Ingresa tu contraseña" value="123456" />
                        </div>
                        <button class="btn btn-primary btn-block" onclick="handleAuth()"><i class="fas fa-sign-in-alt"></i> Ingresar</button>
                        <div class="auth-divider">o</div>
                        <button class="btn btn-outline-primary btn-block" onclick="showRegisterForm()"><i class="fas fa-user-plus"></i> Registrarse</button>
                    </div>
                    <div id="authRegisterForm" style="display:none;">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Nombres</label>
                            <input type="text" class="form-control" id="regName" placeholder="Tus nombres" />
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Apellidos</label>
                            <input type="text" class="form-control" id="regLastName" placeholder="Tus apellidos" />
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-id-card"></i> DNI</label>
                            <input type="text" class="form-control" id="regDni" placeholder="Tu DNI" />
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> Contraseña</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="Crea una contraseña" />
                        </div>
                        <button class="btn btn-primary btn-block" onclick="handleRegister()"><i class="fas fa-user-plus"></i> Registrarme</button>
                        <div class="auth-divider">o</div>
                        <button class="btn btn-outline-primary btn-block" onclick="showLoginForm()"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</button>
                    </div>
                </div>
                <div class="auth-modal-footer">
                    <span id="authModalType">Paciente</span>
                </div>
            </div>
        </div>

        <!-- ==================== FOOTER ==================== -->
        <footer class="app-footer">
            <div class="footer-content">
                <span>GlaucoIA · Diagnóstico Asistido por IA</span>
                <span>Herramienta de apoyo al diagnóstico · No reemplaza al especialista</span>
            </div>
        </footer>
    </div>

    <script src="data/db.js"></script>
    <script src="script.js"></script>
</body>
</html>
